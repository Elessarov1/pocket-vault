[workspace]
members = ["crates/vault-core", "crates/vault-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Elessarov1/pocket-vault"

[workspace.dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hkdf = "0.13.0"
getrandom = "0.4.3"
rand_core = "0.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
thiserror = "2.0.19"
wasm-bindgen = "0.2.126"
zeroize = "1.9.0"
